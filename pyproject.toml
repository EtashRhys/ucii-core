[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ucii-core"
version = "0.1.0"
description = "Universal Cryptographic Identity Infrastructure Core"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}

authors = [
    {name = "UCII"}
]

dependencies = [
    "cryptography>=42.0.0",
    "liboqs-python>=0.16.0",
    "pydantic>=2.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
